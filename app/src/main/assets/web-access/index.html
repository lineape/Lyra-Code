<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark"><title>Lyra Code</title>
  <link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/katex/katex.min.css"><script src="/marked.js" defer></script><script src="/purify.js" defer></script><script src="/i18n.js" defer></script><script src="/reasoning.js" defer></script><script src="/katex/katex.min.js" defer></script><script src="/charts/mermaid.min.js" defer></script><script src="/charts/echarts.min.js" defer></script><script src="/charts/circuit-symbols.js" defer></script><script src="/charts/circuit.js" defer></script><script src="/rich-content.js" defer></script><script src="/stream.js" defer></script><script src="/app.js" defer></script>
</head>
<body>
<svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6m-6 3h6M8 14a6 6 0 1 1 8 0l-1 2H9Z"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h15m-4-4 4 4-4 4M20 16H5m4-4-4 4 4 4"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11a9 9 0 0 1-9 9H4l-1 1v-9a9 9 0 1 1 18-1Z"/><path d="M8 11h8m-4-4v8"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v2M5 10h15a1 1 0 0 1 1 1l-2 8H3l-1-7a2 2 0 0 1 3-2Z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-1 4 2 2-1 3 3 3 3-1 2 2 4-1 1-3 3-1v-4l-3-1-1-3-4-1-2 2Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-attach" viewBox="0 0 24 24"><path d="M9 8v8a3 3 0 0 0 6 0V6a4 4 0 0 0-8 0v10a6 6 0 0 0 12 0V8"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="M12 8v5m0 3h.01"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
  <symbol id="i-prompt" viewBox="0 0 24 24"><path d="M5 4h14v16H5Z M8 8h8M8 12h8m-8 4h5"/></symbol>
  <symbol id="i-agents" viewBox="0 0 24 24"><circle cx="12" cy="6" r="3"/><circle cx="5" cy="18" r="3"/><circle cx="19" cy="18" r="3"/><path d="m10 9-4 6m8-6 4 6M8 18h8"/></symbol>
  <symbol id="i-context" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5Z m-9 9 9 5 9-5m-18 5 9 5 9-5"/></symbol>
  <symbol id="i-tools" viewBox="0 0 24 24"><path d="m14 6 4 4m-8 1 8-8 3 3-8 8-3-3Zm-1 1-6 6 3 3 6-6M5 4l15 16M3 3l3 1-2 2Z"/></symbol>
  <symbol id="i-mcp" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="7" rx="2"/><rect x="4" y="14" width="16" height="7" rx="2"/><path d="M8 7h.01M8 18h.01m4-11h5m-5 11h5"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4H4v16h6m5-12 4 4-4 4m-7-4h11"/></symbol>
</svg>
<section id="login" class="login"><form id="login-form" class="login-card"><p class="eyebrow">LYRA CODE · <span data-i18n="网页访问">网页访问</span></p><h1><span data-i18n="接续手机上的工作">接续手机上的工作</span></h1><p><span data-i18n="在电脑上对话、上传文件与管理 Agent。">在电脑上对话、上传文件与管理 Agent。</span><br><span data-i18n="输入手机「设置 → 网页访问」中的访问码。">输入手机「设置 → 网页访问」中的访问码。</span></p><label><span data-i18n="访问码">访问码</span><input id="token" type="password" autocomplete="current-password" required placeholder="输入访问码" data-i18n-placeholder="输入访问码"></label><button class="primary" type="submit"><span data-i18n="连接手机">连接手机</span> <svg class="icon"><use href="#i-send"/></svg></button><p id="login-error" role="alert"></p></form></section>
<div id="app" class="app" hidden>
  <button id="sidebar-scrim" class="sidebar-scrim" aria-label="关闭会话侧栏" data-i18n-aria-label="关闭会话侧栏" hidden></button>
  <aside id="sidebar" class="sidebar" aria-label="工作区与会话" data-i18n-aria-label="工作区与会话">
    <div class="brand"><strong>Lyra Code</strong><span class="brand-tag">WEB</span><button id="collapse-sidebar" class="icon-button quiet" aria-label="收起会话侧栏" data-i18n-aria-label="收起会话侧栏" title="收起侧栏" data-i18n-title="收起侧栏"><svg class="icon"><use href="#i-panel"/></svg></button></div>
    <button id="new-chat" class="tonal new-chat"><svg class="icon"><use href="#i-chat"/></svg><span data-i18n="新建对话">新建对话</span><kbd>Ctrl K</kbd></button>
    <div class="sidebar-section"><span><span data-i18n="工作区">工作区</span></span><div><button id="search-toggle" class="icon-button quiet" aria-label="搜索会话和项目" data-i18n-aria-label="搜索会话和项目" title="搜索" data-i18n-title="搜索"><svg class="icon"><use href="#i-search"/></svg></button><button data-create-project class="icon-button quiet" aria-label="新建项目" data-i18n-aria-label="新建项目" title="新建项目" data-i18n-title="新建项目"><svg class="icon"><use href="#i-folder"/></svg><span class="add-mark">+</span></button></div></div>
    <label id="history-search-field" class="search-label" hidden><input id="history-search" type="search" placeholder="搜索会话 / 项目" data-i18n-placeholder="搜索会话 / 项目" aria-label="搜索会话或项目" data-i18n-aria-label="搜索会话或项目"></label>
    <div class="history-tabs" role="group" aria-label="会话类型" data-i18n-aria-label="会话类型"><button id="project-history" class="active" aria-pressed="true"><span data-i18n="项目会话">项目会话</span></button><button id="normal-history" aria-pressed="false"><span data-i18n="普通会话">普通会话</span></button></div>
    <div id="history" class="history"></div>
    <footer><button id="settings-button" class="sidebar-settings quiet"><svg class="icon"><use href="#i-settings"/></svg><span data-i18n="设置">设置</span></button><div class="connection-row"><span id="connection"><i></i> <span data-i18n="已连接手机">已连接手机</span></span><button id="logout" class="icon-button quiet" aria-label="断开手机连接" data-i18n-aria-label="断开手机连接" title="断开连接" data-i18n-title="断开连接"><svg class="icon"><use href="#i-logout"/></svg></button></div></footer>
  </aside>
  <main id="main" class="main">
    <header class="topbar"><button id="open-sidebar" class="icon-button quiet" aria-label="展开会话侧栏" data-i18n-aria-label="展开会话侧栏" title="展开侧栏" data-i18n-title="展开侧栏" hidden><svg class="icon"><use href="#i-panel"/></svg></button><h2 id="chat-title"><span data-i18n="新建对话">新建对话</span></h2><div class="top-actions"><span id="run-state"></span><button id="context-button" class="quiet context-button" title="查看上下文用量" data-i18n-title="查看上下文用量"><svg class="icon"><use href="#i-context"/></svg><span id="context-label"><span data-i18n="上下文">上下文</span></span></button></div></header>
    <div class="chat-stage"><div id="messages" class="messages" aria-live="polite"></div><div id="interaction" class="interaction"></div>
      <section class="composer-area">
        <div class="composer-context"><button id="workspace" class="quiet context-chip"><svg class="icon"><use href="#i-folder"/></svg><span id="workspace-label"><span data-i18n="选择工作目录">选择工作目录</span></span><svg class="icon chevron"><use href="#i-down"/></svg></button><button id="prompt-button" class="quiet context-chip"><svg class="icon"><use href="#i-agents"/></svg><span id="prompt-label"><span data-i18n="原生提示词">原生提示词</span></span><svg class="icon chevron"><use href="#i-down"/></svg></button></div>
        <div id="drop-zone" class="composer"><div id="upload-list" class="upload-list"></div><textarea id="input" rows="3" placeholder="描述你想完成的事，或将电脑文件拖到这里…" data-i18n-placeholder="描述你想完成的事，或将电脑文件拖到这里…" aria-label="消息" data-i18n-aria-label="消息"></textarea>
          <div class="composer-actions"><div class="composer-left"><div class="composer-menu-anchor"><button id="composer-more" class="icon-button filled-icon" aria-label="更多对话操作" data-i18n-aria-label="更多对话操作" aria-expanded="false" title="更多操作" data-i18n-title="更多操作"><svg class="icon"><use href="#i-plus"/></svg></button><div id="composer-menu" class="composer-menu" role="menu" hidden><button data-attach role="menuitem"><svg class="icon"><use href="#i-attach"/></svg><span data-i18n="上传文件">上传文件</span></button><button data-open-settings="prompts" role="menuitem"><svg class="icon"><use href="#i-prompt"/></svg><span data-i18n="提示词">提示词</span></button><button data-open-settings="agents" role="menuitem"><svg class="icon"><use href="#i-agents"/></svg><span data-i18n="子代理">子代理</span></button><button data-open-settings="compression" role="menuitem"><svg class="icon"><use href="#i-context"/></svg><span data-i18n="压缩历史">压缩历史</span></button></div></div><button id="attach" class="icon-button quiet" aria-label="上传电脑文件" data-i18n-aria-label="上传电脑文件" title="上传文件" data-i18n-title="上传文件"><svg class="icon"><use href="#i-attach"/></svg></button><label class="approval-control" title="启用后，本会话中的工具调用将自动同意" data-i18n-title="启用后，本会话中的工具调用将自动同意"><input id="auto-approval" type="checkbox" aria-label="无审批模式" data-i18n-aria-label="无审批模式"><svg class="icon"><use href="#i-shield"/></svg><span id="approval-label"><span data-i18n="逐次审批">逐次审批</span></span></label><span id="upload-status"></span></div>
          <div class="composer-right"><label class="model-control"><span class="sr-only"><span data-i18n="模型">模型</span></span><select id="model-select" aria-label="切换模型" data-i18n-aria-label="切换模型"></select></label><button id="reasoning-button" class="quiet reasoning-control" aria-haspopup="dialog" aria-label="推理深度" data-i18n-aria-label="推理深度" title="推理深度" data-i18n-title="推理深度"><svg class="icon"><use href="#i-bulb"/></svg><span id="reasoning-label"></span></button><button id="continue" class="quiet continue-button" title="继续当前会话" data-i18n-title="继续当前会话"><span data-i18n="继续">继续</span></button><button id="stop" class="icon-button stop-button" hidden aria-label="停止回复" data-i18n-aria-label="停止回复" title="停止回复" data-i18n-title="停止回复"><svg class="icon"><use href="#i-stop"/></svg></button><button id="send" class="icon-button primary send-button" aria-label="发送消息" data-i18n-aria-label="发送消息" title="发送" data-i18n-title="发送"><svg class="icon"><use href="#i-send"/></svg></button></div></div>
        </div><div class="composer-hint"><span class="keyboard-hint">Enter <span data-i18n="发送 · Shift Enter 换行">发送 · Shift Enter 换行</span></span><div class="composer-statistics"><span id="tokens-per-second" hidden></span><span id="cache-hit-rate" hidden></span><span id="status"></span></div></div>
      </section>
    </div>
  </main>
</div>
<dialog id="settings" class="settings-dialog" hidden aria-labelledby="settings-title">
  <header><h2 id="settings-title"><span data-i18n="设置">设置</span></h2><span class="settings-sync"><span data-i18n="与手机同步">与手机同步</span></span><button id="close-settings" class="icon-button quiet" aria-label="关闭设置" data-i18n-aria-label="关闭设置"><svg class="icon"><use href="#i-close"/></svg></button></header>
  <div class="settings-body"><nav id="settings-tabs" aria-label="设置分类" data-i18n-aria-label="设置分类"><button data-tab="prompts"><svg class="icon"><use href="#i-prompt"/></svg><span data-i18n="提示词">提示词</span></button><button data-tab="agents"><svg class="icon"><use href="#i-agents"/></svg><span data-i18n="子代理">子代理</span></button><button data-tab="compression"><svg class="icon"><use href="#i-context"/></svg><span data-i18n="上下文 / 压缩">上下文 / 压缩</span></button><button data-tab="tools"><svg class="icon"><use href="#i-tools"/></svg>Agent Tools</button><button data-tab="mcp"><svg class="icon"><use href="#i-mcp"/></svg>MCP <span data-i18n="服务器">服务器</span></button></nav><section class="settings-page"><div class="settings-page-heading"><h3 id="settings-page-title"><span data-i18n="提示词">提示词</span></h3><p id="settings-page-description"></p></div><div id="settings-content"></div></section></div>
</dialog>
<dialog id="reasoning-dialog" class="reasoning-dialog" aria-labelledby="reasoning-title"><header><h2 id="reasoning-title"><span data-i18n="推理深度">推理深度</span></h2><span id="reasoning-model"></span><svg class="icon reasoning-bulb" aria-hidden="true"><use href="#i-bulb"/></svg><button id="close-reasoning" class="icon-button quiet" aria-label="关闭" data-i18n-aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button></header><div class="reasoning-body"><p id="reasoning-preview-label"></p><div class="reasoning-slider"><div id="reasoning-track" aria-hidden="true"><div id="reasoning-track-fill"><div id="reasoning-flow"></div></div></div><div id="reasoning-thumb" aria-hidden="true"><svg class="icon"><use href="#i-swap"/></svg></div><input id="reasoning-range" type="range" min="0" max="5" step="1" aria-label="推理深度" data-i18n-aria-label="推理深度"></div><div id="reasoning-options" class="reasoning-options" role="group" aria-label="推理深度" data-i18n-aria-label="推理深度"></div><div class="reasoning-strength"><span><strong id="reasoning-level">0</strong><small>/5</small></span><b id="reasoning-strength-label"></b><div id="reasoning-dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div><p id="reasoning-hint" class="settings-intro"></p></div></dialog>
<dialog id="visual-dialog" class="visual-dialog" aria-labelledby="visual-title"><header><h2 id="visual-title"></h2><button id="close-visual" class="icon-button quiet" aria-label="关闭" data-i18n-aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button></header><div id="visual-content"></div></dialog>
<input id="file-input" type="file" multiple hidden><dialog id="dialog" aria-labelledby="dialog-title"><header><h2 id="dialog-title"></h2><button id="close-dialog" class="icon-button quiet" aria-label="关闭" data-i18n-aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button></header><div id="dialog-content"></div></dialog><div id="toast" role="status" hidden></div>
</body>
</html>
